<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Muhammad Hasnain Foundation">
  <defs>
    <linearGradient id="shfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15543b"/>
      <stop offset="100%" stop-color="#0a3122"/>
    </linearGradient>
    <linearGradient id="shfGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7b8"/>
      <stop offset="100%" stop-color="#d8b45f"/>
    </linearGradient>
    <g id="shfHand">
      <path d="M100 182c-22-2-41-13-52-31-9-14-13-28-13-39"/>
      <path d="M35 112c-1-10 12-10 13 0l5 27"/>
      <path d="M42 91c-2-10 10-12 13-2l7 31"/>
      <path d="M53 80c-2-10 10-12 13-2l5 29"/>
    </g>
  </defs>

  <rect width="200" height="200" rx="54" fill="url(#shfBg)"/>

  <g fill="none" stroke="url(#shfGold)" stroke-width="4.6"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Hands sit behind: the family is what the foundation holds up. -->
    <use href="#shfHand"/>
    <use href="#shfHand" transform="translate(200,0) scale(-1,1)"/>

    <!-- Each layer is stroked once in the background colour before it is drawn
         in gold, so a line in front reads as being in front instead of
         colliding with the one behind it. -->
    <g stroke="#10412c" stroke-width="12">
      <circle cx="76" cy="40" r="10"/>
      <path d="M62 74v-6c0-9 6-15 14-15s14 6 14 15v6v20h-6v28h-5v-22h-6v22h-5V94h-6z"/>
      <circle cx="124" cy="40" r="10"/>
      <path d="M110 74v-6c0-9 6-15 14-15s14 6 14 15v6l6 28h-40l6-28z"/>
      <path d="M118 102v20M130 102v20"/>
    </g>
    <circle cx="76" cy="40" r="10"/>
    <path d="M62 74v-6c0-9 6-15 14-15s14 6 14 15v6v20h-6v28h-5v-22h-6v22h-5V94h-6z"/>
    <circle cx="124" cy="40" r="10"/>
    <path d="M110 74v-6c0-9 6-15 14-15s14 6 14 15v6l6 28h-40l6-28z"/>
    <path d="M118 102v20M130 102v20"/>

    <g stroke="#10412c" stroke-width="11">
      <circle cx="88" cy="96" r="7"/>
      <path d="M79 120v-4c0-6 4-10 9-10s9 4 9 10v4v14h-4v16h-3v-13h-4v13h-3v-16h-4z"/>
      <circle cx="112" cy="96" r="7"/>
      <path d="M103 120v-4c0-6 4-10 9-10s9 4 9 10v4l4 14h-26l4-14z"/>
      <path d="M108 138v12M116 138v12"/>
    </g>
    <circle cx="88" cy="96" r="7"/>
    <path d="M79 120v-4c0-6 4-10 9-10s9 4 9 10v4v14h-4v16h-3v-13h-4v13h-3v-16h-4z"/>
    <circle cx="112" cy="96" r="7"/>
    <path d="M103 120v-4c0-6 4-10 9-10s9 4 9 10v4l4 14h-26l4-14z"/>
    <path d="M108 138v12M116 138v12"/>
  </g>
</svg>
